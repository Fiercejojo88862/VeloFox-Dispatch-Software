<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeloFox Dispatch — Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0b;
      --bg-soft: #0f0f0f;
      --panel: #141414;
      --panel-hover: #171717;
      --line: #232323;
      --line-strong: #33302a;
      --text: #f4f1ea;
      --muted: #9b968c;
      --accent: #c5a059;
      --accent-bright: #d9bd83;
      --accent-ink: #0b0b0b;
      --radius: 4px;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      --pending: #c5a059;
      --confirmed: #8fb0cf;
      --assigned: #b3a1d0;
      --en-route: #d4a15b;
      --arrived: #73b6b0;
      --aboard: #7fa6d9;
      --completed: #93b39a;
      --cancelled: #cc8a7d;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(1200px 620px at 50% -25%, rgba(255, 255, 255, 0.045), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px clamp(16px, 3.4vw, 44px);
      border-bottom: 1px solid var(--line);
      background: rgba(11, 11, 11, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand { display: flex; align-items: center; gap: 16px; color: inherit; text-decoration: none; }

    .brand:hover .mark { border-color: var(--accent-bright); color: var(--accent-bright); }

    .brand:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

    .nav-link {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.16s ease, border-color 0.16s ease;
    }

    .nav-link:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .nav-link:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 2px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.06em;
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .muted { color: var(--muted); }
    .small { font-size: 11px; letter-spacing: 0.06em; }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: clamp(20px, 3vw, 36px) clamp(16px, 3.4vw, 44px) 80px;
    }

    /* ---------- buttons ---------- */

    .btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      white-space: nowrap;
    }

    .btn:hover { background: var(--panel-hover); border-color: var(--accent); color: var(--accent); }
    .btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .btn-primary:hover {
      background: var(--accent-bright);
      border-color: var(--accent-bright);
      color: var(--accent-ink);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: transparent;
      padding: 7px 8px;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .btn-ghost:hover { background: var(--panel-hover); color: var(--text); border-color: transparent; }
    .btn-sm { padding: 8px 12px; font-size: 10px; border-radius: 2px; }

    /* ---------- summary ---------- */

    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 1px;
      margin-bottom: 24px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .stat {
      background: var(--panel);
      padding: 18px 20px;
      border-top: 2px solid transparent;
    }

    .stat[data-status] { border-top-color: rgba(197, 160, 89, 0.45); }

    .stat-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      white-space: nowrap;
    }

    .stat-label::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--dot, var(--muted));
    }

    .stat-value {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .stat[data-status="pending"] { --dot: var(--pending); }
    .stat[data-status="confirmed"] { --dot: var(--confirmed); }
    .stat[data-status="assigned"] { --dot: var(--assigned); }
    .stat[data-status="en_route"] { --dot: var(--en-route); }
    .stat[data-status="arrived"] { --dot: var(--arrived); }
    .stat[data-status="passenger_aboard"] { --dot: var(--aboard); }
    .stat[data-status="completed"] { --dot: var(--completed); }
    .stat[data-status="cancelled"] { --dot: var(--cancelled); }
    .stat[data-status="total"] { --dot: var(--accent); }

    /* ---------- panel / table ---------- */

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 2px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1060px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      text-align: left;
      padding: 13px 18px;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--line);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid #1d1d1d; }
    tbody tr:last-child { border-bottom: 0; }
    tbody tr:hover { background: var(--panel-hover); }

    td {
      padding: 18px;
      vertical-align: top;
    }

    .ride-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--accent);
    }

    .ride-id + .muted { margin-top: 4px; }

    .route { display: grid; gap: 6px; min-width: 200px; }
    .route-line { display: flex; align-items: center; gap: 10px; }
    .route-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex: none;
      background: var(--dot);
    }
    .route-dot.pickup { --dot: var(--accent); }
    .route-dot.dropoff { --dot: var(--confirmed); }
    .route-place { overflow-wrap: anywhere; }

    .when { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 14px; }
    .when.overdue { color: var(--cancelled); }
    .when .sub { display: block; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cancelled); margin-top: 3px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      border-radius: 2px;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--badge);
      background: color-mix(in srgb, var(--badge) 8%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--badge) 38%, transparent);
    }

    .badge::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--badge);
    }

    .badge[data-status="pending"] { --badge: var(--pending); }
    .badge[data-status="confirmed"] { --badge: var(--confirmed); }
    .badge[data-status="assigned"] { --badge: var(--assigned); }
    .badge[data-status="en_route"] { --badge: var(--en-route); }
    .badge[data-status="arrived"] { --badge: var(--arrived); }
    .badge[data-status="passenger_aboard"] { --badge: var(--aboard); }
    .badge[data-status="completed"] { --badge: var(--completed); }
    .badge[data-status="cancelled"] { --badge: var(--cancelled); }

    .assigned-name { font-weight: 500; overflow-wrap: anywhere; font-size: 14px; }
    .unassigned { color: var(--muted); font-style: normal; font-size: 13px; }

    /* ---------- row actions ---------- */

    .actions { display: grid; gap: 9px; min-width: 220px; }
    .actions-label {
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    select.status-select,
    .assign input {
      width: 100%;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--bg-soft);
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      padding: 9px 10px;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    select.status-select { cursor: pointer; }

    select.status-select:focus,
    .assign input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(197, 160, 89, 0.35);
    }

    select.status-select:disabled,
    .assign input:disabled,
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .assign { display: grid; gap: 6px; }
    .assign input { flex: 1; min-width: 0; }
    .assign .btn { flex: none; }
    .assign input::placeholder { color: var(--muted); }

    /* ---------- states ---------- */

    .table-state {
      padding: 64px 24px;
      text-align: center;
      color: var(--muted);
    }

    .table-state strong {
      display: block;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* ---------- toasts ---------- */

    .toasts {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      display: grid;
      gap: 10px;
      max-width: min(380px, calc(100vw - 40px));
    }

    .toast {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 2px solid var(--muted);
      border-radius: 2px;
      padding: 13px 15px;
      font-size: 13px;
      box-shadow: var(--shadow);
      animation: toast-in 0.16s ease-out;
    }

    .toast.success { border-left-color: var(--completed); }
    .toast.error { border-left-color: var(--cancelled); }
    .toast ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- responsive ---------- */

    @media (max-width: 1180px) {
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 960px) {
      table { min-width: 0; }
      thead { display: none; }
      tbody, tr, td { display: block; width: 100%; }
      tbody tr {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin: 14px;
        padding: 6px 16px;
        background: var(--bg-soft);
      }
      tbody tr:hover { background: var(--bg-soft); }
      td {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        padding: 11px 0;
        border-bottom: 1px solid #1d1d1d;
      }
      td:last-child { border-bottom: 0; }
      td::before {
        content: attr(data-label);
        flex: none;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        padding-top: 3px;
      }
      td > * { text-align: right; }
      td[data-label="Actions"] { flex-direction: column; align-items: stretch; }
      td[data-label="Actions"]::before { padding-top: 0; }
      td[data-label="Actions"] > * { text-align: left; }
      .actions { min-width: 0; }
      .route { justify-items: end; }
      .route-line { justify-content: flex-end; }
      .table-state { margin: 14px; }
    }

    @media (max-width: 560px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .topbar-actions { justify-content: flex-start; }
      td { flex-direction: column; gap: 6px; }
      td > * { text-align: left; }
      .route { justify-items: start; }
      .route-line { justify-content: flex-start; }
    }  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" title="Back to home">
      <div class="mark" aria-hidden="true">VF</div>
      <div>
        <h1>VeloFox Dispatch</h1>
        <p>Fleet reservations &amp; ride coordination</p>
      </div>
    </a>
    <div class="topbar-actions">
      <a class="nav-link" href="/">Home</a>
      <span id="last-updated" class="muted small">Loading…</span>
      <button id="refresh" class="btn" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <section id="stats" class="stats" aria-label="Booking summary"></section>

    <section class="panel" aria-labelledby="bookings-heading">
      <div class="panel-head">
        <h2 id="bookings-heading">Bookings</h2>
        <span id="booking-count" class="muted small"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Ride</th>
              <th scope="col">Route</th>
              <th scope="col">Pickup</th>
              <th scope="col">Vehicle</th>
              <th scope="col">Status</th>
              <th scope="col">Assigned vehicle</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="bookings-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <datalist id="fleet">
    <option value="Executive Sedan 01"></option>
    <option value="Executive Sedan 02"></option>
    <option value="Luxury SUV 01"></option>
    <option value="Luxury SUV 02"></option>
    <option value="Sprinter Van 01"></option>
    <option value="Limousine 01"></option>
  </datalist>

  <script>
    'use strict';

    const API_URL = '/api/bookings';
    const STATUSES = [
      'pending', 'confirmed', 'assigned', 'en_route', 'arrived',
      'passenger_aboard', 'completed', 'cancelled',
    ];
    const STATUS_TRANSITIONS = {
      pending: ['confirmed', 'cancelled'],
      confirmed: ['assigned', 'cancelled'],
      assigned: ['en_route', 'cancelled'],
      en_route: ['arrived', 'cancelled'],
      arrived: ['passenger_aboard', 'cancelled'],
      passenger_aboard: ['completed', 'cancelled'],
      completed: [],
      cancelled: [],
    };
    const STATUS_LABELS = {
      pending: 'Pending',
      confirmed: 'Confirmed',
      assigned: 'Assigned',
      en_route: 'En Route',
      arrived: 'On Location',
      passenger_aboard: 'Passenger Aboard',
      completed: 'Completed',
      cancelled: 'Cancelled',
    };
    const VEHICLE_LABELS = {
      sedan: 'Sedan',
      suv: 'SUV',
      sprinter: 'Sprinter',
      limousine: 'Limousine',
    };
    const REFRESH_INTERVAL_MS = 30000;

    const tbody = document.getElementById('bookings-body');
    const statsEl = document.getElementById('stats');
    const countEl = document.getElementById('booking-count');
    const lastUpdatedEl = document.getElementById('last-updated');
    const refreshBtn = document.getElementById('refresh');
    const toastsEl = document.getElementById('toasts');

    /** @type {Array<object>} */
    let bookings = [];
    let isLoading = false;
    let hasLoadedOnce = false;

    const dateFormatter = new Intl.DateTimeFormat(undefined, {
      dateStyle: 'medium',
      timeStyle: 'short',
    });

    const capitalize = (value) => value.charAt(0).toUpperCase() + value.slice(1);
    const formatStatus = (value) => STATUS_LABELS[value] || capitalize(value);

    function formatVehicleType(value) {
      const key = typeof value === 'string' ? value.trim().toLowerCase() : '';
      return VEHICLE_LABELS[key] || (key ? capitalize(key) : '—');
    }

    function formatDateTime(value) {
      const timestamp = Date.parse(value);
      return Number.isNaN(timestamp) ? String(value ?? '—') : dateFormatter.format(timestamp);
    }

    function isOverdue(booking) {
      const timestamp = Date.parse(booking.pickupDateTime);
      if (Number.isNaN(timestamp) || timestamp >= Date.now()) return false;
      return booking.status !== 'completed' && booking.status !== 'cancelled';
    }

    /* ------------------------------ API ------------------------------ */

    class ApiError extends Error {
      constructor(message, details) {
        super(message);
        this.name = 'ApiError';
        this.details = details;
      }
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });

      const text = await response.text();
      let data = null;
      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          data = null;
        }
      }

      if (!response.ok) {
        throw new ApiError(
          (data && data.error) || `Request failed with status ${response.status}.`,
          (data && Array.isArray(data.details)) ? data.details : []
        );
      }

      return data;
    }

    async function loadBookings({ quiet = false } = {}) {
      if (isLoading) return;
      isLoading = true;
      refreshBtn.disabled = true;

      try {
        const data = await request(API_URL);
        bookings = Array.isArray(data) ? data : [];
        hasLoadedOnce = true;
        render();
        lastUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        if (!quiet) {
          if (!hasLoadedOnce) {
            renderLoadError(error);
          }
          showToast(error.message, 'error', error.details);
        }
        lastUpdatedEl.textContent = 'Update failed';
      } finally {
        isLoading = false;
        refreshBtn.disabled = false;
      }
    }

    async function patchBooking(id, payload) {
      const updated = await request(`${API_URL}/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        body: JSON.stringify(payload),
      });

      const index = bookings.findIndex((booking) => booking.id === id);
      if (index >= 0 && updated) bookings[index] = updated;
      render();
      return updated;
    }

    /* --------------------------- rendering --------------------------- */

    function makeStatCard(key, label, value) {
      const card = document.createElement('div');
      card.className = 'stat';
      card.dataset.status = key;

      const labelEl = document.createElement('div');
      labelEl.className = 'stat-label';
      labelEl.textContent = label;

      const valueEl = document.createElement('div');
      valueEl.className = 'stat-value';
      valueEl.textContent = String(value);

      card.append(labelEl, valueEl);
      return card;
    }

    function renderStats() {
      const counts = { total: bookings.length };
      STATUSES.forEach((status) => {
        counts[status] = bookings.filter((booking) => booking.status === status).length;
      });

      statsEl.replaceChildren(
        makeStatCard('total', 'Total rides', counts.total),
        ...STATUSES.map((status) => makeStatCard(status, formatStatus(status), counts[status]))
      );
    }

    function makeCell(label, ...children) {
      const cell = document.createElement('td');
      cell.dataset.label = label;
      cell.append(...children);
      return cell;
    }

    function makeBadge(status) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.dataset.status = status;
      badge.textContent = formatStatus(status);
      return badge;
    }

    function makeRouteLine(kind, place) {
      const line = document.createElement('div');
      line.className = 'route-line';

      const dot = document.createElement('span');
      dot.className = `route-dot ${kind}`;
      dot.setAttribute('aria-hidden', 'true');

      const text = document.createElement('span');
      text.className = 'route-place';
      text.textContent = place;

      line.append(dot, text);
      return line;
    }

    function makeStatusSelect(booking) {
      const select = document.createElement('select');
      select.className = 'status-select';
      select.setAttribute('aria-label', `Update status for ride ${booking.id.slice(0, 8)}`);

      const availableStatuses = [booking.status, ...(STATUS_TRANSITIONS[booking.status] || [])];
      availableStatuses.forEach((status) => {
        const option = document.createElement('option');
        option.value = status;
        option.textContent = formatStatus(status);
        select.append(option);
      });

      select.value = booking.status;

      select.addEventListener('change', async () => {
        const nextStatus = select.value;
        if (nextStatus === booking.status) return;

        select.disabled = true;
        try {
          const updated = await patchBooking(booking.id, { status: nextStatus });
          showToast(`Ride ${updated.id.slice(0, 8)} marked as ${nextStatus}.`, 'success');
        } catch (error) {
          select.value = booking.status;
          showToast(error.message, 'error', error.details);
        } finally {
          select.disabled = false;
        }
      });

      return select;
    }

    function makeAssignForm(booking) {
      const form = document.createElement('form');
      form.className = 'assign';

      const vehicleInput = document.createElement('input');
      vehicleInput.type = 'text';
      vehicleInput.maxLength = 100;
      vehicleInput.placeholder = 'Vehicle';
      vehicleInput.value = booking.assignedVehicle || '';
      vehicleInput.setAttribute('list', 'fleet');
      vehicleInput.setAttribute('aria-label', `Assign a vehicle to ride ${booking.id.slice(0, 8)}`);

      const driverInput = document.createElement('input');
      driverInput.type = 'text';
      driverInput.maxLength = 50;
      driverInput.placeholder = 'Driver ID';
      driverInput.value = booking.driverId || '';
      driverInput.autocapitalize = 'characters';
      driverInput.setAttribute('aria-label', `Assign a driver to ride ${booking.id.slice(0, 8)}`);

      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.className = 'btn btn-primary btn-sm';
      submit.textContent = 'Assign';

      form.append(vehicleInput, driverInput, submit);

      if (booking.assignedVehicle || booking.driverId) {
        const clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'btn btn-ghost btn-sm';
        clearBtn.textContent = 'Clear';
        clearBtn.title = 'Remove the assigned vehicle';
        clearBtn.addEventListener('click', async () => {
          clearBtn.disabled = true;
          try {
            await patchBooking(booking.id, { assignedVehicle: null, driverId: null });
            showToast(`Assignment removed from ride ${booking.id.slice(0, 8)}.`, 'success');
          } catch (error) {
            clearBtn.disabled = false;
            showToast(error.message, 'error', error.details);
          }
        });
        form.append(clearBtn);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const vehicle = vehicleInput.value.trim();
        const driverId = driverInput.value.trim();

        if (!vehicle || !driverId) {
          showToast('Enter both a vehicle and Driver ID before assigning.', 'error');
          (vehicle ? driverInput : vehicleInput).focus();
          return;
        }

        submit.disabled = true;
        vehicleInput.disabled = true;
        driverInput.disabled = true;
        try {
          await patchBooking(booking.id, { assignedVehicle: vehicle, driverId });
          showToast(`Vehicle and driver assigned to ride ${booking.id.slice(0, 8)}.`, 'success');
        } catch (error) {
          submit.disabled = false;
          vehicleInput.disabled = false;
          driverInput.disabled = false;
          showToast(error.message, 'error', error.details);
        }
      });

      return form;
    }

    function makeRow(booking) {
      const row = document.createElement('tr');

      const idEl = document.createElement('div');
      idEl.className = 'ride-id';
      idEl.textContent = `#${booking.id.slice(0, 8)}`;
      idEl.title = booking.id;

      const createdEl = document.createElement('div');
      createdEl.className = 'muted small';
      createdEl.textContent = booking.createdAt ? `Created ${formatDateTime(booking.createdAt)}` : '';

      const rideCell = makeCell('Ride', idEl, createdEl);

      const route = document.createElement('div');
      route.className = 'route';
      route.append(
        makeRouteLine('pickup', booking.pickupLocation),
        makeRouteLine('dropoff', booking.dropoffLocation)
      );

      const when = document.createElement('div');
      when.className = isOverdue(booking) ? 'when overdue' : 'when';
      when.textContent = formatDateTime(booking.pickupDateTime);

      if (isOverdue(booking)) {
        const note = document.createElement('span');
        note.className = 'sub';
        note.textContent = 'Past pickup time';
        when.append(note);
      }

      const vehicleType = document.createElement('div');
      vehicleType.textContent = formatVehicleType(booking.vehicleType);

      const passengers = document.createElement('div');
      passengers.className = 'muted small';
      const count = Number(booking.passengerCount);
      passengers.textContent = `${count} ${count === 1 ? 'passenger' : 'passengers'}`;

      const assigned = document.createElement('div');
      if (booking.assignedVehicle) {
        assigned.className = 'assigned-name';
        assigned.textContent = booking.driverId
          ? `${booking.assignedVehicle} · ${booking.driverId}`
          : booking.assignedVehicle;
      } else {
        assigned.className = 'unassigned';
        assigned.textContent = 'Unassigned';
      }

      const actions = document.createElement('div');
      actions.className = 'actions';

      const statusLabel = document.createElement('span');
      statusLabel.className = 'actions-label';
      statusLabel.textContent = 'Set status';

      actions.append(statusLabel, makeStatusSelect(booking), makeAssignForm(booking));

      row.append(
        rideCell,
        makeCell('Route', route),
        makeCell('Pickup', when),
        makeCell('Vehicle', vehicleType, passengers),
        makeCell('Status', makeBadge(booking.status)),
        makeCell('Assigned', assigned),
        makeCell('Actions', actions)
      );

      return row;
    }

    function renderState(title, message, actionLabel, onAction) {
      const wrapper = document.createElement('div');
      wrapper.className = 'table-state';

      const heading = document.createElement('strong');
      heading.textContent = title;

      const text = document.createElement('div');
      text.textContent = message;

      wrapper.append(heading, text);

      if (actionLabel && onAction) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-sm';
        button.style.marginTop = '14px';
        button.textContent = actionLabel;
        button.addEventListener('click', onAction);
        wrapper.append(button);
      }

      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 7;
      cell.style.padding = '0';
      cell.append(wrapper);
      row.append(cell);

      tbody.replaceChildren(row);
    }

    function renderLoadError(error) {
      renderState('Could not load bookings', error.message, 'Try again', () => {
        tbody.replaceChildren();
        loadBookings();
      });
    }

    function render() {
      renderStats();
      countEl.textContent = `${bookings.length} ${bookings.length === 1 ? 'ride' : 'rides'}`;

      if (bookings.length === 0) {
        renderState(
          'No bookings yet',
          'New reservations from the client app will appear here automatically.'
        );
        return;
      }

      const fragment = document.createDocumentFragment();
      bookings
        .slice()
        .sort((a, b) => Date.parse(b.createdAt || 0) - Date.parse(a.createdAt || 0))
        .forEach((booking) => fragment.append(makeRow(booking)));

      tbody.replaceChildren(fragment);
    }

    /* ----------------------------- toasts ----------------------------- */

    function showToast(message, type = 'info', details = []) {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      const text = document.createElement('div');
      text.textContent = message;
      toast.append(text);

      if (Array.isArray(details) && details.length > 0) {
        const list = document.createElement('ul');
        details.forEach((detail) => {
          const item = document.createElement('li');
          item.textContent = detail;
          list.append(item);
        });
        toast.append(list);
      }

      toastsEl.append(toast);
      setTimeout(() => toast.remove(), 6000);
    }

    /* ------------------------------ boot ------------------------------ */

    refreshBtn.addEventListener('click', () => loadBookings());

    renderStats();
    renderState('Loading bookings', 'Fetching the latest reservations…');

    setInterval(() => {
      if (document.hidden) return;
      const active = document.activeElement;
      if (active && active.closest('#bookings-body')) return;
      loadBookings({ quiet: true });
    }, REFRESH_INTERVAL_MS);

    loadBookings();
  </script>
</body>
</html>
