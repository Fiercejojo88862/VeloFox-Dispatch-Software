<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeloFox Dispatch — Financial performance</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="/js/theme.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0b;
      --bg-soft: #0f0f0f;
      --panel: #141414;
      --panel-hover: #171717;
      --line: #232323;
      --line-strong: #33302a;
      --text: #f4f1ea;
      --muted: #9b968c;
      --accent: #c5a059;
      --accent-bright: #d9bd83;
      --accent-ink: #0b0b0b;
      --radius: 4px;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      --completed: #93b39a;
      --cancelled: #cc8a7d;
      --confirmed: #8fb0cf;
      --pending: #c5a059;
      --assigned: #b3a1d0;
      --en-route: #d4a15b;
      --arrived: #73b6b0;
      --aboard: #7fa6d9;
      --dropped-off: #8ab69c;
    }

    .pages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .page-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.16s ease, color 0.16s ease;
    }
    .page-link:hover { border-color: var(--accent); color: var(--accent); }
    .page-link:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
    .page-link .page-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .page-link .page-path { margin-top: 2px; font-size: 9.5px; color: var(--muted); letter-spacing: 0.06em; }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(1200px 620px at 50% -25%, rgba(255, 255, 255, 0.045), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px clamp(16px, 3.4vw, 44px);
      border-bottom: 1px solid var(--line);
      background: rgba(11, 11, 11, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand { display: flex; align-items: center; gap: 16px; color: inherit; text-decoration: none; }

    .brand:hover .mark { border-color: var(--accent-bright); color: var(--accent-bright); }

    .brand:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

    .nav-link {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.16s ease, border-color 0.16s ease;
    }

    .nav-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

    .nav-link:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 2px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.06em;
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .muted { color: var(--muted); }
    .small { font-size: 11px; letter-spacing: 0.06em; }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: clamp(20px, 3vw, 36px) clamp(16px, 3.4vw, 44px) 80px;
    }

    /* ---------- buttons ---------- */

    .btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      white-space: nowrap;
    }

    .btn:hover { background: var(--panel-hover); border-color: var(--accent); color: var(--accent); }
    .btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

    .btn-sm { padding: 8px 12px; font-size: 10px; border-radius: 2px; }

    /* ---------- panel ---------- */

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 2px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ---------- states / toasts ---------- */

    .table-state {
      padding: 64px 24px;
      text-align: center;
      color: var(--muted);
    }

    .table-state strong {
      display: block;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .toasts {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      display: grid;
      gap: 10px;
      max-width: min(380px, calc(100vw - 40px));
    }

    .toast {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 2px solid var(--muted);
      border-radius: 2px;
      padding: 13px 15px;
      font-size: 13px;
      box-shadow: var(--shadow);
      animation: toast-in 0.16s ease-out;
    }

    .toast.success { border-left-color: var(--completed); }
    .toast.error { border-left-color: var(--cancelled); }
    .toast ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- financial performance ---------- */

    .analytics-body { padding: 22px 24px 26px; display: grid; gap: 22px; }

    .analytics-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .analytics-controls select {
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text);
      background: var(--bg-soft);
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      padding: 8px 10px;
    }
    .analytics-controls select:focus { outline: none; border-color: var(--accent); }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .kpi { background: var(--bg-soft); padding: 16px 18px; }
    .kpi-label { font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .kpi-value { margin-top: 8px; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .kpi-value.is-gold { color: var(--accent-bright); }
    .kpi-sub { margin-top: 4px; font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }
    .metric {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-left: 2px solid var(--line);
      border-radius: var(--radius);
      transition: border-color 0.16s ease;
    }
    .metric:hover { border-color: var(--line-strong); }
    .metric .metric-label { font-size: 9px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .metric .metric-value { font-variant-numeric: tabular-nums; color: var(--text); font-size: 17px; font-weight: 500; }
    .metric.is-pending { border-left-color: var(--pending); }
    .metric.is-confirmed { border-left-color: var(--confirmed); }
    .metric.is-assigned { border-left-color: var(--assigned); }
    .metric.is-en_route { border-left-color: var(--en-route); }
    .metric.is-arrived { border-left-color: var(--arrived); }
    .metric.is-passenger_aboard { border-left-color: var(--aboard); }
    .metric.is-dropped_off { border-left-color: var(--dropped-off); }
    .metric.is-completed { border-left-color: var(--completed); }
    .metric.is-cancelled { border-left-color: var(--cancelled); }

    .analytics-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; }
    .analytics-block h3 {
      margin: 0 0 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .analytics-block p.hint { margin: 0 0 12px; font-size: 11px; color: var(--muted); }

    .chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; border-bottom: 1px solid var(--line); }
    .chart-bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 100%; }
    .chart-bar .fill {
      display: block;
      min-height: 2px;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(180deg, var(--accent-bright), rgba(197, 160, 89, 0.2));
      box-shadow: 0 0 14px rgba(197, 160, 89, 0.22);
      transition: height 0.35s ease;
    }
    .chart-bar:hover .fill { background: linear-gradient(180deg, #f0d7a5, rgba(197, 160, 89, 0.35)); }
    .chart-bar .bar-label { text-align: center; font-size: 8.5px; letter-spacing: 0.06em; color: var(--muted); }
    .chart-axis { display: flex; justify-content: space-between; margin-top: 8px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

    .mode-split { display: grid; gap: 14px; }
    .mode-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 11px; }
    .mode-name { letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .mode-value { font-variant-numeric: tabular-nums; color: var(--text); }
    .mode-track { margin-top: 7px; height: 8px; border-radius: 4px; background: #1b1b1b; overflow: hidden; }
    .mode-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); }
    .mode-fill.is-hourly { background: linear-gradient(90deg, #6f86a8, var(--confirmed)); }

    .driver-list { display: grid; gap: 11px; }
    .driver-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12px; padding-bottom: 8px; border-bottom: 1px solid #1b1b1b; }
    .driver-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .driver-name { color: var(--text); }
    .driver-name small { display: block; color: var(--muted); font-size: 9.5px; letter-spacing: 0.1em; }
    .driver-revenue { color: var(--accent-bright); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .analytics-note {
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0.04em;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    /* ---------- responsive ---------- */

    @media (max-width: 1180px) {
      .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .analytics-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .analytics-body { padding: 18px 16px 20px; }
      .chart-bar .bar-label { display: none; }
    }  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" title="Back to home">
      <div class="mark" aria-hidden="true"><img class="topbar-logo" src="/images/VeloFox.png" alt="VeloFox"></div>
      <div>
        <h1>VeloFox Dispatch</h1>
        <p>Fleet reservations &amp; ride coordination</p>
      </div>
    </a>
    <div class="topbar-actions">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/dashboard.html">Dispatch board</a>
      <span id="last-updated" class="muted small">Loading…</span>
      <button id="sound-toggle" class="btn btn-sm" type="button" aria-pressed="false">Sound on</button>
      <button id="logout" class="btn" type="button">Sign out</button>
      <button id="refresh" class="btn" type="button" data-audio="confirm">Refresh</button>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="analytics-heading">
      <div class="panel-head">
        <div>
          <h2 id="analytics-heading">Financial performance</h2>
          <span class="muted small">Revenue recognized on completed rides · USD</span>
        </div>
        <div class="analytics-controls">
          <label class="sr-only" for="analytics-range">Reporting range</label>
          <select id="analytics-range">
            <option value="7d">Last 7 days</option>
            <option value="30d" selected>Last 30 days</option>
            <option value="90d">Last 90 days</option>
            <option value="all">All time</option>
          </select>
          <button id="analytics-refresh" class="btn btn-sm" type="button" data-audio="confirm">Refresh</button>
        </div>
      </div>
      <div id="analytics-body" class="analytics-body" aria-live="polite">
        <div class="table-state" style="padding: 32px 8px;">Loading reporting data…</div>
      </div>
    </section>

    <section class="panel" aria-labelledby="status-heading">
      <div class="panel-head">
        <div>
          <h2 id="status-heading">Ride status</h2>
          <span class="muted small">Count by current status</span>
        </div>
      </div>
      <div id="status-body" class="metrics-grid" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="pages-heading">
      <div class="panel-head">
        <div>
          <h2 id="pages-heading">Available pages</h2>
          <span class="muted small">Dispatcher app and login pages</span>
        </div>
      </div>
      <div id="pages-body" class="pages-grid" aria-live="polite"></div>
    </section>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <script src="/js/audio-fx.js"></script>
  <script>
    'use strict';

    const analyticsEl = document.getElementById('analytics-body');
    const analyticsRangeEl = document.getElementById('analytics-range');
    const analyticsRefreshBtn = document.getElementById('analytics-refresh');
    const toastsEl = document.getElementById('toasts');
    const lastUpdatedEl = document.getElementById('last-updated');
    const refreshBtn = document.getElementById('refresh');
    const soundToggleBtn = document.getElementById('sound-toggle');
    const statusBody = document.getElementById('status-body');
    const pagesBody = document.getElementById('pages-body');

    const STATUSES = [
      'pending', 'confirmed', 'assigned', 'en_route', 'arrived',
      'passenger_aboard', 'dropped_off', 'completed', 'cancelled',
    ];
    const STATUS_LABELS = {
      pending: 'Pending',
      confirmed: 'Confirmed',
      assigned: 'Assigned',
      en_route: 'On Route',
      arrived: 'On Location',
      passenger_aboard: 'POB',
      dropped_off: 'Dropped Off',
      completed: 'Completed',
      cancelled: 'Cancelled',
    };
    const PAGES = [
      { path: '/', title: 'Home', purpose: 'Public home, booking intake and information hub.' },
      { path: '/dashboard.html', title: 'Dispatcher dashboard', purpose: 'Live booking board, telemetry and dispatch tools.' },
      { path: '/financial.html', title: 'Financial performance', purpose: 'Revenue, utilization and driver contribution reporting.' },
      { path: '/booking.html', title: 'Bookings intake', purpose: 'Fast client booking intake form.' },
      { path: '/client.html', title: 'Client portal', purpose: 'Client self-service portal for trips and receipts.' },
      { path: '/client-login.html', title: 'Client login', purpose: 'Sign in for the client portal.' },
      { path: '/dispatcher-login.html', title: 'Dispatcher login', purpose: 'Dispatcher sign-in (admin and agents).' },
      { path: '/driver.html', title: 'Driver portal', purpose: 'Chauffeur job management and status updates.' },
      { path: '/admin.html', title: 'Administrator console', purpose: 'Administrator tools for the dispatcher team.' },
      { path: '/forgot-password.html', title: 'Forgot password', purpose: 'Password recovery entry point.' },
      { path: '/login.html', title: 'Login', purpose: 'General login page.' },
      { path: '/reset-password.html', title: 'Reset password', purpose: 'Set a new password after requesting a reset.' },
    ];

    const usd = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD',
      maximumFractionDigits: 0,
    });
    const formatUsd = (cents) => usd.format((Number(cents) || 0) / 100);

    const shortDate = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });

    /* ------------------------------ API ------------------------------ */

    class ApiError extends Error {
      constructor(message, details) {
        super(message);
        this.name = 'ApiError';
        this.details = details;
      }
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });

      const text = await response.text();
      let data = null;
      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          data = null;
        }
      }

      if (!response.ok) {
        throw new ApiError(
          (data && data.error) || `Request failed with status ${response.status}.`,
          (data && Array.isArray(data.details)) ? data.details : []
        );
      }

      return data;
    }

    /* ----------------------------- analytics ----------------------------- */

    function makeKpi(label, value, sub, { gold = false } = {}) {
      const card = document.createElement('div');
      card.className = 'kpi';

      const labelEl = document.createElement('div');
      labelEl.className = 'kpi-label';
      labelEl.textContent = label;

      const valueEl = document.createElement('div');
      valueEl.className = gold ? 'kpi-value is-gold' : 'kpi-value';
      valueEl.textContent = String(value);

      card.append(labelEl, valueEl);

      if (sub) {
        const subEl = document.createElement('div');
        subEl.className = 'kpi-sub';
        subEl.textContent = sub;
        card.append(subEl);
      }

      return card;
    }

    function makeMetric(label, value, status) {
      const card = document.createElement('div');
      card.className = `metric is-${status}`;

      const labelEl = document.createElement('div');
      labelEl.className = 'metric-label';
      labelEl.textContent = label;

      const valueEl = document.createElement('div');
      valueEl.className = 'metric-value';
      valueEl.textContent = String(value);

      card.append(labelEl, valueEl);
      return card;
    }

    function renderStatusGrid(data) {
      const grid = document.createElement('div');
      grid.className = 'metrics-grid';
      STATUSES.forEach((status) => {
        const count = Number((data.byStatus && data.byStatus[status]) || 0);
        grid.append(makeMetric(STATUS_LABELS[status], count, status));
      });
      return grid;
    }

    function renderPages() {
      pagesBody.replaceChildren(
        ...PAGES.map(({ path, title, purpose }) => {
          const link = document.createElement('a');
          link.className = 'page-link';
          link.href = path;
          link.title = purpose;

          const titleEl = document.createElement('span');
          titleEl.className = 'page-title';
          titleEl.textContent = title;

          const pathEl = document.createElement('span');
          pathEl.className = 'page-path';
          pathEl.textContent = path;

          link.append(titleEl, pathEl);
          return link;
        })
      );
    }

    function buildTrendChart(days) {
      const wrapper = document.createElement('div');
      const chart = document.createElement('div');
      chart.className = 'chart';

      const peak = Math.max(1, ...days.map((day) => day.revenueCents));

      days.forEach((day) => {
        const column = document.createElement('div');
        column.className = 'chart-bar';

        const fill = document.createElement('span');
        fill.className = 'fill';
        fill.style.height = `${Math.max(1.5, (day.revenueCents / peak) * 100)}%`;
        fill.title = `${shortDate.format(new Date(`${day.date}T12:00:00`))}: ${formatUsd(day.revenueCents)} · ${day.rides} completed`;

        const label = document.createElement('span');
        label.className = 'bar-label';
        label.textContent = shortDate.format(new Date(`${day.date}T12:00:00`)).replace(',', '');

        column.append(fill, label);
        chart.append(column);
      });

      const axis = document.createElement('div');
      axis.className = 'chart-axis';
      axis.innerHTML = '<span>Oldest</span><span>Today</span>';

      wrapper.append(chart, axis);
      return wrapper;
    }

    function buildModeSplit(byMode) {
      const totalRides = Math.max(1, byMode.point_to_point.rides + byMode.hourly.rides);
      const rows = [
        { key: 'point_to_point', label: 'Point to point', data: byMode.point_to_point },
        { key: 'hourly', label: 'Hourly charter', data: byMode.hourly },
      ];

      const wrapper = document.createElement('div');
      wrapper.className = 'mode-split';

      rows.forEach(({ key, label, data }) => {
        const row = document.createElement('div');

        const head = document.createElement('div');
        head.className = 'mode-head';

        const name = document.createElement('span');
        name.className = 'mode-name';
        name.textContent = `${label} · ${data.rides}`;

        const value = document.createElement('span');
        value.className = 'mode-value';
        value.textContent = formatUsd(data.revenueCents);

        head.append(name, value);

        const track = document.createElement('div');
        track.className = 'mode-track';

        const fill = document.createElement('div');
        fill.className = key === 'hourly' ? 'mode-fill is-hourly' : 'mode-fill';
        fill.style.width = `${Math.round((data.rides / totalRides) * 100)}%`;
        track.append(fill);

        row.append(head, track);
        wrapper.append(row);
      });

      return wrapper;
    }

    function renderAnalytics(data) {
      const totals = data.totals;
      const fragment = document.createDocumentFragment();

      const kpis = document.createElement('div');
      kpis.className = 'kpi-grid';
      kpis.append(
        makeKpi('Revenue', formatUsd(totals.revenueCents), `${totals.completed} completed`, { gold: true }),
        makeKpi('Pipeline', formatUsd(totals.pipelineCents), 'Active + pending'),
        makeKpi('Completed', totals.completed, `${totals.active} active now`),
        makeKpi('Pending', totals.pending, `${totals.cancelled} cancelled`),
        makeKpi('Active trips', data.utilization.activeTrips, 'In motion now'),
        makeKpi('Rides in range', totals.rides, `${totals.completed} completed`),
        makeKpi('Cancelled', totals.cancelled),
        makeKpi('Completion rate', `${Math.round(data.utilization.completionRate * 100)}%`, 'Of finished rides'),
        makeKpi('Chauffeurs', data.drivers.length, 'With completed rides'),
        makeKpi('Deposits', formatUsd(totals.depositCents), 'Held by passenger'),
        makeKpi('Average fare', formatUsd(totals.averageFareCents), 'Per completed ride'),
        makeKpi('Gratuity', formatUsd(totals.gratuityCents), 'Tips received')
      );
      fragment.append(kpis);

      const columns = document.createElement('div');
      columns.className = 'analytics-grid';

      const trendBlock = document.createElement('div');
      trendBlock.className = 'analytics-block';
      const trendHeading = document.createElement('h3');
      trendHeading.textContent = 'Revenue trend';
      const trendHint = document.createElement('p');
      trendHint.className = 'hint';
      trendHint.textContent = 'Completed rides by scheduled pickup date.';
      trendBlock.append(trendHeading, trendHint, buildTrendChart(data.revenueByDay));

      const sideBlock = document.createElement('div');
      sideBlock.className = 'analytics-block';
      const modeHeading = document.createElement('h3');
      modeHeading.textContent = 'Charter mix';
      const modeHint = document.createElement('p');
      modeHint.className = 'hint';
      modeHint.textContent = 'Ride volume per billing model.';
      sideBlock.append(modeHeading, modeHint, buildModeSplit(data.byMode));

      const driverHeading = document.createElement('h3');
      driverHeading.textContent = 'Chauffeur contribution';
      driverHeading.style.marginTop = '20px';
      sideBlock.append(driverHeading);

      if (data.drivers.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'hint';
        empty.textContent = 'No completed rides with an assigned chauffeur in this range.';
        sideBlock.append(empty);
      } else {
        const list = document.createElement('div');
        list.className = 'driver-list';
        data.drivers.forEach((driver) => {
          const row = document.createElement('div');
          row.className = 'driver-row';

          const name = document.createElement('span');
          name.className = 'driver-name';

          const display = document.createElement('strong');
          display.textContent = driver.name;
          const meta = document.createElement('small');
          meta.textContent = `${driver.driverId} · ${driver.completed} rides`;

          name.append(display, meta);

          const revenue = document.createElement('span');
          revenue.className = 'driver-revenue';
          revenue.textContent = formatUsd(driver.revenueCents);

          row.append(name, revenue);
          list.append(row);
        });
        sideBlock.append(list);
      }

      columns.append(trendBlock, sideBlock);
      fragment.append(columns);

      const note = document.createElement('p');
      note.className = 'analytics-note';
      note.textContent = [
        `Fleet utilization: ${data.utilization.assignedDrivers} of ${data.utilization.fleetDrivers} chauffeurs assigned`,
        `${data.utilization.activeTrips} trips in motion`,
        `completion rate ${Math.round(data.utilization.completionRate * 100)}%`,
      ].join(' · ');
      fragment.append(note);

      if (totals.rides === 0) {
        const seedWrap = document.createElement('div');
        const hint = document.createElement('p');
        hint.className = 'hint';
        hint.textContent = 'No rides in this range yet. Load demo history to preview the reporting view.';

        const seedBtn = document.createElement('button');
        seedBtn.type = 'button';
        seedBtn.className = 'btn btn-sm';
        seedBtn.textContent = 'Seed demo history';
        seedBtn.addEventListener('click', async () => {
          seedBtn.disabled = true;
          seedBtn.textContent = 'Seeding…';
          try {
            const result = await request('/api/demo/history', { method: 'POST' });
            showToast(`Loaded ${result.created} completed demo rides.`, 'success');
            await loadAnalytics();
          } catch (error) {
            seedBtn.disabled = false;
            seedBtn.textContent = 'Seed demo history';
            showToast(error.message, 'error', error.details);
          }
        });

        seedWrap.append(hint, seedBtn);
        fragment.append(seedWrap);
      }

      analyticsEl.replaceChildren(fragment);
      statusBody.replaceChildren(renderStatusGrid(data));
    }

    async function loadAnalytics({ quiet = false } = {}) {
      analyticsRefreshBtn.disabled = true;
      try {
        const range = encodeURIComponent(analyticsRangeEl.value);
        const data = await request(`/api/analytics/summary?range=${range}`);
        renderAnalytics(data);
        lastUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        if (!quiet) {
          analyticsEl.replaceChildren();
          const state = document.createElement('div');
          state.className = 'table-state';
          state.style.padding = '32px 8px';
          state.textContent = `Reporting unavailable: ${error.message}`;
          analyticsEl.append(state);
        }
      } finally {
        analyticsRefreshBtn.disabled = false;
      }
    }

    /* ----------------------------- toasts ----------------------------- */

    function showToast(message, type = 'info', details = []) {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      const text = document.createElement('div');
      text.textContent = message;
      toast.append(text);

      if (Array.isArray(details) && details.length > 0) {
        const list = document.createElement('ul');
        details.forEach((detail) => {
          const item = document.createElement('li');
          item.textContent = detail;
          list.append(item);
        });
        toast.append(list);
      }

      toastsEl.append(toast);
      setTimeout(() => toast.remove(), 6000);
    }

    /* ------------------------------ boot ------------------------------ */

    refreshBtn.addEventListener('click', () => loadAnalytics());
    window.VeloFoxAudio?.attachMuteToggle(soundToggleBtn);
    analyticsRangeEl.addEventListener('change', () => loadAnalytics());
    analyticsRefreshBtn.addEventListener('click', () => loadAnalytics());

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.replace('/dispatcher-login.html');
    });

    renderPages();
    loadAnalytics();
  </script>
</body>
</html>
